[versions]
kotlin           = "1.9.25"
agp              = "8.6.1"
gradle           = "8.9"
ksp              = "1.9.25-1.0.20"
hilt             = "2.51.1"
composeCompiler  = "1.5.15"
composeBom       = "2024.06.00"
material3        = "1.2.1"
coroutines       = "1.8.1"
room             = "2.6.1"
datastore        = "1.1.1"
lifecycle        = "2.8.2"
navigation       = "2.7.7"
activityCompose  = "1.9.0"
okhttp           = "4.12.0"
retrofit         = "2.9.0"
ktor             = "2.3.11"
work             = "2.9.0"
biometric        = "1.1.0"
securityCrypto   = "1.1.0-alpha06"
sqlcipher        = "4.5.5"
sqlite           = "2.4.0"
coreKtx          = "1.13.1"
junit5           = "5.10.2"
junitPlatform   = "1.10.2"
mockk            = "1.13.11"
turbine          = "1.1.0"
robolectric      = "4.12.1"
detekt           = "1.23.6"
testExtJunit     = "1.1.5"
testRunner       = "1.5.2"

[libraries]
kotlinx-coroutines-core        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",        version.ref = "coroutines" }
kotlinx-coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",        version.ref = "coroutines" }
androidx-core-ktx              = { module = "androidx.core:core-ktx",                              version.ref = "coreKtx" }
androidx-appcompat             = { module = "androidx.appcompat:appcompat",                         version = "1.7.0" }
androidx-activity-compose      = { module = "androidx.activity:activity-compose",                   version.ref = "activityCompose" }
androidx-lifecycle-viewmodel   = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",        version.ref = "lifecycle" }
androidx-lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-compose",          version.ref = "lifecycle" }
androidx-navigation-compose    = { module = "androidx.navigation:navigation-compose",                version.ref = "navigation" }
androidx-compose-bom           = { module = "androidx.compose:compose-bom",                         version.ref = "composeBom" }
androidx-compose-ui            = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling    = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation    = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3     = { module = "androidx.compose.material3:material3",                 version.ref = "material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-test       = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-room-runtime          = { module = "androidx.room:room-runtime",                           version.ref = "room" }
androidx-room-ktx              = { module = "androidx.room:room-ktx",                              version.ref = "room" }
androidx-room-compiler         = { module = "androidx.room:room-compiler",                          version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences",             version.ref = "datastore" }
androidx-work-runtime          = { module = "androidx.work:work-runtime-ktx",                      version.ref = "work" }
androidx-biometric             = { module = "androidx.biometric:biometric",                        version.ref = "biometric" }
androidx-security-crypto       = { module = "androidx.security:security-crypto",                   version.ref = "securityCrypto" }
androidx-sqlite                = { module = "androidx.sqlite:sqlite-ktx",                          version.ref = "sqlite" }
sqlcipher-android              = { module = "net.zetetic:sqlcipher-android",                       version.ref = "sqlcipher" }
hilt-android                   = { module = "com.google.dagger:hilt-android",                      version.ref = "hilt" }
hilt-compiler                  = { module = "com.google.dagger:hilt-compiler",                     version.ref = "hilt" }
hilt-navigation-compose        = { module = "androidx.hilt:hilt-navigation-compose",               version = "1.2.0" }
hilt-work                      = { module = "androidx.hilt:hilt-work",                             version = "1.2.0" }
okhttp                         = { module = "com.squareup.okhttp3:okhttp",                        version.ref = "okhttp" }
okhttp-logging                 = { module = "com.squareup.okhttp3:logging-interceptor",            version.ref = "okhttp" }
retrofit                       = { module = "com.squareup.retrofit2:retrofit",                    version.ref = "retrofit" }
ktor-server-core               = { module = "io.ktor:ktor-server-core-jvm",                        version.ref = "ktor" }
ktor-server-netty              = { module = "io.ktor:ktor-server-netty-jvm",                       version.ref = "ktor" }
junit-jupiter-api              = { module = "org.junit.jupiter:junit-jupiter-api",                 version.ref = "junit5" }
junit-jupiter-engine           = { module = "org.junit.jupiter:junit-jupiter-engine",              version.ref = "junit5" }
junit-platform-launcher        = { module = "org.junit.platform:junit-platform-launcher",           version.ref = "junitPlatform" }
mockk                          = { module = "io.mockk:mockk",                                     version.ref = "mockk" }
turbine                        = { module = "app.cash.turbine:turbine",                            version.ref = "turbine" }
robolectric                    = { module = "org.robolectric:robolectric",                        version.ref = "robolectric" }
androidx-test-ext-junit        = { module = "androidx.test.ext:junit",                             version.ref = "testExtJunit" }
androidx-test-runner           = { module = "androidx.test:runner",                               version.ref = "testRunner" }

[plugins]
android-application    = { id = "com.android.application",     version.ref = "agp" }
android-library        = { id = "com.android.library",         version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp",      version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt                 = { id = "io.gitlab.arturbosch.detekt",  version.ref = "detekt" }
